version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    groups:
      all-pip-deps:
        patterns:
          - "*"
        # Optional: uncomment to restrict to production deps only
        # dependency-type: "production"
